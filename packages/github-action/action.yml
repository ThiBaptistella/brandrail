name: Brandrail check
description: Score every pull request against your design system, annotate violations and comment with fixes.
author: Brandrail
branding:
  icon: check-circle
  color: green

inputs:
  api-key:
    description: Brandrail API key (store it as a secret). Uploads results to your dashboard and lets the check use your published Brand Kit.
    required: false
    default: ""
  api-url:
    description: Brandrail URL.
    required: false
    default: ""
  config:
    description: Path to brandrail.config.json, relative to working-directory. If missing and api-key is set, the published Brand Kit is used.
    required: false
    default: brandrail.config.json
  working-directory:
    description: Folder to scan.
    required: false
    default: "."
  fail-below:
    description: Fail the check when the brand score is lower than this (0-100). Leave empty for advisory mode.
    required: false
    default: ""
  changed-only:
    description: On pull requests, only report lines the PR adds or changes.
    required: false
    default: "true"
  comment:
    description: Post (and keep updating) one PR comment with the score and fixes.
    required: false
    default: "true"
  upload-snippets:
    description: Include the offending source line in uploads. Off by default so code never leaves your runner.
    required: false
    default: "false"
  github-token:
    description: Token used to comment on the pull request.
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: Brand score (0-100).
    value: ${{ steps.brandrail.outputs.score }}
  errors:
    description: Number of error-level violations.
    value: ${{ steps.brandrail.outputs.errors }}

runs:
  using: composite
  steps:
    - id: brandrail
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BR_API_KEY: ${{ inputs.api-key }}
        BR_API_URL: ${{ inputs.api-url }}
        BR_CONFIG: ${{ inputs.config }}
        BR_FAIL_BELOW: ${{ inputs.fail-below }}
        BR_CHANGED_ONLY: ${{ inputs.changed-only }}
        BR_COMMENT: ${{ inputs.comment }}
        BR_UPLOAD_SNIPPETS: ${{ inputs.upload-snippets }}
        BR_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/dist/index.mjs"
